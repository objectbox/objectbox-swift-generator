stages:
  - build

build:
  stage: build
  tags: [mac, x64, xcode]
  script:
    - swift build
    - swift test


build_artifacts:
  stage: build
  needs: [ 'build' ]
  tags: [mac, x64, xcode]
  script:
    - ./_build.command
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - ./bin/ObjectBoxGenerator.artifactbundle.zip